name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: eBPF build tools (the probe compiles bpf/*.bpf.c with clang)
        run: sudo apt-get install -y --no-install-recommends clang libbpf-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  sampler-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Privileged unit exposure must stay SAFE (≤ 2.0, i.e. threshold 20/100)
        run: |
          systemd-analyze security --offline=yes --threshold=20 data/systemd/drainscope-sampler.service
          systemd-analyze security --offline=yes --threshold=20 data/systemd/drainscope-probe.service
      - name: D-Bus and polkit files are well-formed
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout data/dbus/interfaces/*.xml data/dbus/system.d/*.conf data/polkit/*.policy

  selinux:
    runs-on: ubuntu-latest
    # Fedora's own registry: Docker Hub's anonymous pull limit failed these runs.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - run: dnf install -y --setopt=install_weak_deps=False selinux-policy-devel make
      - name: The policy modules compile
        working-directory: data/selinux
        run: make -f /usr/share/selinux/devel/Makefile drainscope_sampler.pp drainscope_probe.pp

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A release binary from GitHub: the Docker-based action pulled its image from Docker Hub,
      # whose anonymous pull limit failed these runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @drainscope/extension build
      - run: pnpm --filter @drainscope/app build

  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shipped app icons match the brand kit exports (branding/exports/app-icon)
        run: |
          for icon in io.github.khaledsaeed18.Drainscope.svg io.github.khaledsaeed18.Drainscope-symbolic.svg; do
            cmp branding/exports/app-icon/"$icon" data/app/icons/"$icon"
          done
