[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]
default-members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/KhaledSaeed18/drainscope"
publish = false

[workspace.dependencies]
drainscope-model = { path = "crates/model" }
drainscope-sys = { path = "crates/sys" }
drainscope-store = { path = "crates/store" }
drainscope-dbus = { path = "crates/dbus" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
proptest = "1"
rustix = { version = "1", features = ["process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "signal"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_xml = "5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
