[package]
name = "drainscope-daemon"
description = "User daemon: collects, attributes, stores and serves Monitor1 on the session bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "drainscope-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
drainscope-dbus.workspace = true
drainscope-model.workspace = true
drainscope-store.workspace = true
drainscope-sys.workspace = true
futures-util.workspace = true
rustix.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-journald.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
drainscope-testkit.workspace = true
tempfile.workspace = true
zbus = { workspace = true, features = ["p2p"] }
zbus_xml.workspace = true

[lints]
workspace = true
