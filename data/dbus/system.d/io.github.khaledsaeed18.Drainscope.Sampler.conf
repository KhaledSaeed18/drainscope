<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Only the sampler's user may own the name. Anyone may call it: every call is still
  authorized by polkit (io.github.khaledsaeed18.Drainscope.read-energy).
-->
<busconfig>
  <policy user="drainscope-sampler">
    <allow own="io.github.khaledsaeed18.Drainscope.Sampler"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.khaledsaeed18.Drainscope.Sampler"
           send_interface="io.github.khaledsaeed18.Drainscope.Sampler1"/>
    <allow send_destination="io.github.khaledsaeed18.Drainscope.Sampler"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.khaledsaeed18.Drainscope.Sampler"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.khaledsaeed18.Drainscope.Sampler"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
