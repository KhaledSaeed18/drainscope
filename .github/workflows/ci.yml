name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  sampler-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sampler unit exposure must stay SAFE (≤ 2.0, i.e. threshold 20/100)
        run: systemd-analyze security --offline=yes --threshold=20 data/systemd/drainscope-sampler.service
      - name: D-Bus and polkit files are well-formed
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout data/dbus/interfaces/*.xml data/dbus/system.d/*.conf data/polkit/*.policy

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @drainscope/extension build
